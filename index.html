<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VoiceLab — YES Customer Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0eef8;
  --bg2:#e8e4f4;
  --surface:#ffffff;
  --surface2:#f5f2fc;
  --line:#ddd8f0;
  --ink:#3d3557;
  --muted:#8b82b0;
  --dim:#b8b0d4;
  --purple:#a78bca;
  --pink:#e8a0bf;
  --mint:#85c9b8;
  --peach:#f4b8a0;
  --blue:#90bde0;
  --lavender:#c4b0e8;
  --good:#7cc9a4;
  --bad:#e896a0;
  --gold:#d4a574;
  --sans:"Nunito","Helvetica Neue",system-ui,sans-serif;
  --display:"Quicksand","Nunito",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#f0eef8 0%,#ede8f8 30%,#f0eaf4 60%,#eef4f8 100%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:680px;margin:0 auto;padding:20px 16px 60px}

/* topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 0 20px;border-bottom:2px solid var(--line);margin-bottom:28px}
.brandlogo{height:26px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1.5px solid var(--lavender);color:var(--purple);background:rgba(167,139,202,.1)}
.grow{flex:1}

/* type */
h1{font-family:var(--display);font-size:28px;font-weight:700;color:var(--ink);margin:6px 0 4px;letter-spacing:-.01em}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);font-weight:700;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:6px 0 0}

/* cards */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:14px;box-shadow:0 2px 12px rgba(167,139,202,.08)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px}
.label:first-child{margin-top:0}

/* inputs */
input,select{width:100%;background:var(--surface2);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font-family:var(--sans);font-size:14px;font-weight:500;outline:none;appearance:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--purple)}
input[type="date"]{color:var(--ink)}
select option{background:#fff}

/* buttons */
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--purple),var(--lavender));color:#fff;border:none;border-radius:14px;padding:14px;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.01em;cursor:pointer;transition:opacity .15s,transform .1s;box-shadow:0 4px 16px rgba(167,139,202,.35)}
.btn:hover{opacity:.92;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.mint{background:linear-gradient(135deg,var(--mint),#a8ddd0);box-shadow:0 4px 16px rgba(133,201,184,.35)}
.btn.peach{background:linear-gradient(135deg,var(--peach),#f8d0c0);color:var(--ink);box-shadow:0 4px 16px rgba(244,184,160,.35)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0;border-radius:12px;padding:10px 16px;box-shadow:none}
.btn.ghost:hover{border-color:var(--purple);color:var(--purple);transform:none}
.btn.pink{background:linear-gradient(135deg,var(--pink),#f0c0d8);color:var(--ink);box-shadow:0 4px 16px rgba(232,160,191,.35)}
.btn.sm{font-size:13px;padding:9px 14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.row{display:flex;gap:10px;align-items:center}

/* note bar */
.note-bar{background:rgba(167,139,202,.08);border:1.5px solid rgba(167,139,202,.2);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}

/* CALL SCREEN */
.status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:5px;color:var(--good);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.callwrap{display:flex;flex-direction:column;align-items:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 0 20px;width:100%}

/* avatar with rings */
.av{position:relative;width:120px;height:120px}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--lavender);opacity:.2;animation:ringout 2.2s ease-out infinite}
.ring.r2{animation-delay:.55s;border-color:var(--pink)}
.ring.r3{animation-delay:1.1s;border-color:var(--mint)}
@keyframes ringout{0%{transform:scale(1);opacity:.3}100%{transform:scale(1.7);opacity:0}}
.av[data-mode="speaking"] .ring{border-color:var(--pink);opacity:.5}
.av[data-mode="speaking"] .ring.r2{border-color:var(--peach)}
.av[data-mode="speaking"] .ring.r3{border-color:var(--lavender)}
.av[data-mode="busy"] .ring{border-color:var(--gold);animation-duration:.9s}
.av[data-mode="listening"] .ring{border-color:var(--mint)}
.av[data-mode="idle"] .ring{opacity:.08}
.avc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,var(--lavender),var(--pink));font-family:var(--display);font-size:30px;font-weight:700;color:#fff;z-index:1;box-shadow:0 4px 20px rgba(167,139,202,.3)}

.pn{font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink)}
.ploc{font-size:12px;color:var(--muted);letter-spacing:.05em;font-weight:500}
.call-status-hint{font-size:13px;color:var(--purple);min-height:22px;font-weight:600;letter-spacing:.02em}

/* mic wave bars (shown while listening) */
.wave{display:flex;align-items:center;gap:3px;height:28px}
.wave span{display:block;width:4px;border-radius:4px;background:var(--mint);animation:wavebar 1s ease-in-out infinite}
.wave span:nth-child(1){animation-delay:0s;height:8px}
.wave span:nth-child(2){animation-delay:.1s;height:16px}
.wave span:nth-child(3){animation-delay:.2s;height:24px}
.wave span:nth-child(4){animation-delay:.3s;height:16px}
.wave span:nth-child(5){animation-delay:.4s;height:8px}
@keyframes wavebar{0%,100%{transform:scaleY(.5);opacity:.5}50%{transform:scaleY(1);opacity:1}}

/* speaking bars */
.speak-wave{display:flex;align-items:center;gap:3px;height:28px}
.speak-wave span{display:block;width:4px;border-radius:4px;background:var(--pink);animation:wavebar 0.7s ease-in-out infinite}
.speak-wave span:nth-child(1){animation-delay:0s;height:6px}
.speak-wave span:nth-child(2){animation-delay:.08s;height:18px}
.speak-wave span:nth-child(3){animation-delay:.16s;height:26px}
.speak-wave span:nth-child(4){animation-delay:.24s;height:18px}
.speak-wave span:nth-child(5){animation-delay:.32s;height:6px}

/* end call button */
.endcall{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--bad),#f0a8b4);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:18px auto 0;box-shadow:0 6px 24px rgba(232,150,160,.4);transition:transform .1s}
.endcall:hover{transform:scale(1.06)}
.endcall svg{width:24px;height:24px;fill:#fff}
.endcall-label{font-size:10px;color:var(--muted);text-align:center;margin-top:7px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}

/* live caption */
.caption-bar{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;font-size:13px;color:var(--muted);margin-top:14px;width:100%;min-height:40px;text-align:center;font-style:italic;box-shadow:0 2px 8px rgba(167,139,202,.06)}

/* transcript */
.transcript{max-height:200px;overflow-y:auto;margin-top:14px;display:flex;flex-direction:column;gap:8px;width:100%}
.tline{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.who{font-size:10px;letter-spacing:.06em;text-transform:uppercase;min-width:38px;margin-top:2px;flex-shrink:0;font-weight:700}
.who.p{color:var(--purple)}
.who.r{color:var(--mint)}

/* spin */
.spin-ring{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--purple);animation:sp .8s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* DEBRIEF */
.score-big{font-family:var(--display);font-size:60px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pass-badge{display:inline-block;padding:5px 16px;border-radius:999px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.pass-badge.pass{background:rgba(124,201,164,.15);color:var(--good);border:1.5px solid rgba(124,201,164,.4)}
.pass-badge.fail{background:rgba(232,150,160,.15);color:var(--bad);border:1.5px solid rgba(232,150,160,.4)}
.section-title{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);font-weight:800;margin:16px 0 8px}
.li{font-size:13.5px;line-height:1.55;padding:5px 0 5px 18px;position:relative;color:var(--ink)}
.li::before{content:"\2022";position:absolute;left:0;color:var(--purple)}
.rubric-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1.5px solid var(--line)}
.rubric-row:last-child{border-bottom:none}
.rubric-label{font-size:13.5px;font-weight:600;color:var(--ink)}
.rubric-score{font-family:var(--mono);font-weight:800;font-size:14px;color:var(--purple);white-space:nowrap;margin-left:12px}
.rubric-notes{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.cte-box{background:rgba(232,150,160,.1);border:1.5px solid rgba(232,150,160,.4);border-radius:14px;padding:14px 16px;margin:10px 0}
.cte-box .section-title{color:var(--bad);margin-top:0}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:6px}
.profile-item{font-size:12.5px;color:var(--muted)}.profile-item b{color:var(--ink)}

/* dashboard */
.dash-stat{text-align:center;padding:14px}
.dash-stat .val{font-family:var(--display);font-size:36px;font-weight:800}
.dash-stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:4px}
code{font-family:var(--mono);background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:11.5px}
</style>
</head>

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}
function pick(r,a){return a[Math.floor(r()*a.length)];}
function chance(r,p){return r()<p;}

/* Build CPL persona */
function buildProfile(){
  const seed=(Date.now()^(Math.random()*1e9))>>>0;
  const r=rng(seed);
  const female=chance(r,.5);
  const name=female?pick(r,CPL.femaleNames):pick(r,CPL.maleNames);
  const ttsVoice=female?pick(r,CPL.voicesF):pick(r,CPL.voicesM);
  const entry=pick(r,CPL.entries);
  const area=pick(r,CPL.areas);
  const beds=pick(r,[1,2,2,3,3,4]);
  const baths=Math.max(1,Math.min(beds,pick(r,[1,1,2,2,3])));
  // HPOG hour recommendation
  let recHours=3;
  if(beds>=3||baths>=3) recHours=6;
  else if(beds===2||baths===2) recHours=4;
  // upcharge for hours beyond the free 3h voucher
  const upcharge=recHours===3?0:recHours===4?19:59;
  const ages=[28,32,36,40,45,50,55,38,42,48];
  return {
    seed,name,female,area,entry,ttsVoice,beds,baths,recHours,upcharge,
    age:pick(r,ages),
    lifestyle:pick(r,CPL.lifestyles),
    commStyle:pick(r,CPL.commStyles),
    priority:pick(r,CPL.priorities),
    decision:pick(r,CPL.decisions),
    homeType:pick(r,CPL.homeTypes),
    household:pick(r,CPL.households),
    cleaningHabit:pick(r,CPL.cleaningHabits),
    serviceExp:pick(r,CPL.serviceExp),
    hasPets:chance(r,.4),
    occupation:pick(r,["Project Manager","Nurse","Teacher","Software Engineer","Sales Rep","Accountant","Small Business Owner","Real Estate Agent","Retired","Healthcare Worker"]),
  };
}

   ============================================================ */
async function callAPI(body){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),30000);
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
    clearTimeout(to);
    if(!r.ok) throw new Error("api/chat "+r.status);
    const d=await r.json();
    // Anthropic response format
    return (d.content||[]).map(b=>b.type==="text"?b.text:"").join("").trim();
  }catch(e){clearTimeout(to);return null;}
}

async function llmReply(p,history){
  const system=buildCustomerPrompt(p);
  const messages=history.map(m=>({role:m.speaker==="agent"?"user":"assistant",content:m.text}));
  let out=await callAPI({model:"claude-sonnet-4-6",max_tokens:100,system,messages});
  if(!out)return null;
  out=out.split("\n").filter(l=>{const lo=l.toLowerCase();return !lo.startsWith("agent:")&&!lo.includes("as an ai")&&!lo.includes("great job");}).join(" ").trim();
  return out||null;
}

async function llmEvaluate(p,history){
  const transcript=history.map(m=>`${m.speaker==="customer"?p.name:"AGENT"}: ${m.text}`).join("\n");
  const system=buildEvaluatorPrompt(p);
  const out=await callAPI({model:"claude-sonnet-4-6",max_tokens:2500,system,messages:[{role:"user",content:"TRANSCRIPT:\n"+transcript+"\n\nEvaluate using YCER-001. Return valid JSON only."}]});
  if(!out)return null;
  try{return JSON.parse(out.replace(/^```json|^```|```$/gm,"").trim());}catch(e){return null;}
}

/* ============================================================
   TTS — OpenAI via Vercel /api/speak
   ============================================================ */
let _audio=null;
let lastTTSError="";

async function _fetchAudio(text,voice){
  try{
    const r=await fetch("/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"tts-1",voice,input:text,response_format:"mp3"})});
    if(!r.ok){lastTTSError="TTS HTTP "+r.status;return null;}
    return await r.arrayBuffer();
  }catch(e){lastTTSError=e.message;return null;}
}

async function _playBuffer(buf,onEnded){
  const url=URL.createObjectURL(new Blob([buf],{type:"audio/mpeg"}));
  const a=new Audio(url);
  _audio=a; ST.speaking=true; renderStatus();
  return new Promise(res=>{
    a.onended=()=>{_stopAudio();URL.revokeObjectURL(url);if(onEnded)onEnded();res(true);};
    a.onerror=()=>{_stopAudio();URL.revokeObjectURL(url);res(false);};
    a.play().catch(()=>{_stopAudio();res(false);});
  });
}

function _stopAudio(){try{if(_audio){_audio.pause();_audio.src="";_audio=null;}}catch(e){}ST.speaking=false;}

function _speakBrowser(text,onDone){
  if(!("speechSynthesis" in window)){if(onDone)onDone();return;}
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const vs=window.speechSynthesis.getVoices();
    const pref=vs.find(v=>/en[-_]US/i.test(v.lang)&&/natural|samantha|google/i.test(v.name))||vs.find(v=>/en/i.test(v.lang));
    if(pref)u.voice=pref; u.rate=1.02;
    u.onstart=()=>{ST.speaking=true;renderStatus();};
    u.onend=()=>{ST.speaking=false;renderStatus();if(onDone)onDone();};
    u.onerror=()=>{ST.speaking=false;if(onDone)onDone();};
    window.speechSynthesis.speak(u);
  }catch(e){if(onDone)onDone();}
}

function _splitSentences(text){
  const raw=text.match(/[^.!?]+[.!?]+["\']?|[^.!?]+$/g)||[text];
  const out=[];
  for(let i=0;i<raw.length;i++){
    const s=raw[i].trim();if(!s)continue;
    if(out.length&&s.split(/\s+/).length<4){out[out.length-1]+=" "+s;}else{out.push(s);}
  }
  return out.filter(Boolean);
}

async function speak(text,onDone){
  if(!text||!text.trim()){if(onDone)onDone();return;}
  if(ST.call&&ST.call.ended){if(onDone)onDone();return;}
  const voice=ST.call?.profile?.ttsVoice||"nova";
  const sentences=_splitSentences(text);
  if(!sentences.length){if(onDone)onDone();return;}
  let nextFetch=_fetchAudio(sentences[0],voice);
  for(let i=0;i<sentences.length;i++){
    if(ST.call&&ST.call.ended)break;
    const futureFetch=(i+1<sentences.length)?_fetchAudio(sentences[i+1],voice):null;
    const buf=await nextFetch;
    nextFetch=futureFetch;
    if(buf){_stopAudio();await _playBuffer(buf,null);}
    else{await new Promise(res=>{_speakBrowser(sentences[i],()=>res());});}
    if(ST.call&&ST.call.ended)break;
  }
  if(onDone)onDone();
}

function stopAudio(){_stopAudio();try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}ST.speaking=false;}

/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function speechSupported(){return !!SR;}
let _rec=null,_finalText="",_silenceTimer=null,_maxTimer=null,_micGranted=false,_pendingRestart=null,_submitted=false;
const SILENCE_MS=1300,MAX_LISTEN_MS=45000;
function _clearTimers(){if(_silenceTimer){clearTimeout(_silenceTimer);_silenceTimer=null;}if(_maxTimer){clearTimeout(_maxTimer);_maxTimer=null;}}
function _armSilence(){
  _clearTimers();
  _silenceTimer=setTimeout(()=>{
    const text=_finalText.trim();
    if(text&&!_submitted&&!ST.busy&&ST.call&&!ST.call.ended){_submitted=true;_finalText="";try{if(_rec)_rec.stop();}catch(e){}submitAgent(text);}
    else{try{if(_rec)_rec.stop();}catch(e){}}
  },SILENCE_MS);
}
async function warmUpMic(){
  if(_micGranted)return true;
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());_micGranted=true;return true;}
  catch(e){_micGranted=false;return false;}
}
function _buildRec(){
  if(_rec)return _rec;
  _rec=new SR();_rec.lang="en-US";_rec.continuous=true;_rec.interimResults=true;_rec.maxAlternatives=1;
  _rec.onresult=ev=>{
    let interim="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)_finalText+=t+" ";else interim+=t;}
    const live=(_finalText+interim).trim();
    const cap=document.getElementById("caption");if(cap)cap.textContent=live||"Listening\u2026";
    if(ST.speaking&&live.length>3){stopAudio();}
    _armSilence();
  };
  _rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="audio-capture"){_micGranted=false;ST.autoVoice=false;ST.listening=false;render();}};
  _rec.onend=()=>{
    _clearTimers();ST.listening=false;
    const text=_finalText.trim();_finalText="";
    if(ST.call&&ST.call.ended){_submitted=false;render();return;}
    if(text&&!_submitted&&!ST.busy){_submitted=true;submitAgent(text);}
    else if(!_submitted&&ST.autoVoice&&ST.call&&!ST.call.ended&&!ST.busy&&!ST.speaking){_pendingRestart=setTimeout(startListening,200);}
    else{render();}
    _submitted=false;
  };
  return _rec;
}
async function startListening(){
  if(!SR||ST.busy||!ST.call||ST.call.ended||ST.speaking)return;
  const ok=await warmUpMic();if(!ok){render();return;}
  try{const r=_buildRec();_finalText="";_clearTimers();ST.listening=true;render();r.start();_maxTimer=setTimeout(()=>{try{if(_rec)_rec.stop();}catch(e){}},MAX_LISTEN_MS);}
  catch(e){ST.listening=false;render();}
}
function stopListening(){_clearTimers();try{if(_rec){_rec.stop();}}catch(e){}ST.listening=false;}
function stopAll(){if(_pendingRestart){clearTimeout(_pendingRestart);_pendingRestart=null;}stopListening();stopAudio();}

let _clock=null;
function startClock(){if(_clock)clearInterval(_clock);_clock=setInterval(()=>{const el=document.getElementById("clock");if(el){const s=Math.floor((Date.now()-ST.startedAt)/1000);el.textContent=(Math.floor(s/60)<10?"0":"")+Math.floor(s/60)+":"+(s%60<10?"0":"")+(s%60);}},200);}
function stopClock(){if(_clock){clearInterval(_clock);_clock=null;}}

/* ============================================================
   CALL FLOW
   ============================================================ */
function pushCustomer(text){
  if(!text||!ST.call||ST.call.ended)return;
  ST.history.push({speaker:"customer",text});render();
  speak(text,()=>{if(ST.call&&!ST.call.ended&&ST.autoVoice&&!ST.busy)startListening();});
}

async function submitAgent(text){
  if(ST.busy||!ST.call||ST.call.ended)return;
  ST.history.push({speaker:"agent",text});ST.busy=true;render();
  let line=await llmReply(ST.call.profile,ST.history);
  ST.busy=false;if(!line)line="Sorry, could you say that again?";
  ST.history.push({speaker:"customer",text:line});render();
  speak(line,()=>{if(ST.call&&!ST.call.ended&&ST.autoVoice&&!ST.busy)startListening();});
}

async function startCall(){
  const p=buildProfile();
  ST.call={profile:p,ended:false};ST.history=[];ST.score=null;
  ST.startedAt=Date.now();ST.busy=false;ST.callIncomplete=false;ST._dashSaved=false;
  ST.view="call";render();
  ST.autoVoice=speechSupported();if(ST.autoVoice)await warmUpMic();
  pushCustomer(p.entry.line);
}

async function endCall(){
  ST.autoVoice=false;if(ST.call)ST.call.ended=true;
  stopAll();stopClock();
  if(ST.view==="debrief")return;
  const agentTurns=ST.history.filter(m=>m.speaker==="agent").length;
  ST.callIncomplete=agentTurns<2;ST.view="debrief";render();
  if(!ST.callIncomplete){const res=await llmEvaluate(ST.call.profile,ST.history);ST.score=res;render();}
}

      <div class="ploc">${esc(p.area)}</div>
      <div class="call-status-hint">${hintText}</div>
      ${waveHTML}
    </div>
    <button class="endcall" id="endBtn" title="End call &amp; get scored">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
    </button>
    <div class="endcall-label">Tap to end &amp; score</div>
    <div class="caption-bar">
      <span id="caption" style="font-size:13px">${ST.listening?"&#127908; "+("Listening…"):ST.busy?"Processing…":"Speak after the customer finishes"}</span>
    </div>
    <div class="transcript" id="transcript">
      ${ST.history.map(m=>`<div class="tline"><span class="who ${m.speaker==="customer"?"p":"r"}">${m.speaker==="customer"?firstName(p.name):"You"}</span><span>${esc(m.text)}</span></div>`).join("")}
    </div>
  </div>`;
  renderStatus();
  document.getElementById("endBtn").onclick=endCall;
  const tr=document.getElementById("transcript");if(tr)tr.scrollTop=tr.scrollHeight;
  startClock();
}

/* DEBRIEF */
function renderDebrief(app){
  const p=ST.call?ST.call.profile:null;
  const sc=ST.score;

  if(ST.callIncomplete){
    app.innerHTML=`
    <div class="topbar"><img src="${LOGO_DATA_URI}" class="brandlogo" alt="PA"/><span class="pill">YES Customer Simulator</span><span class="grow"></span></div>
    <div class="kicker">Call ended</div><h1>Not enough to score</h1>
    <div class="card" style="margin-top:14px">
      <p class="sub" style="margin-top:0">The call ended with fewer than 2 agent turns. Not scored or saved.</p>
      <div class="section-title">Quick checks</div>
      <div class="li">Check your browser for a mic permission prompt &#8212; it must say <b>Allowed</b>.</div>
      <div class="li">Speak clearly after the customer finishes &#8212; the mic only listens on your turn.</div>
      <div class="li">Use <b>Chrome or Edge on desktop</b> for best microphone support.</div>
    </div>
    <button class="btn mint" id="again" style="margin-top:16px">&#128222; Try again</button>`;
    document.getElementById("again").onclick=startCall;return;
  }

  if(!sc){
    app.innerHTML=`
    <div class="topbar"><img src="${LOGO_DATA_URI}" class="brandlogo" alt="PA"/><span class="pill">YES Customer Simulator</span><span class="grow"></span></div>
    <div class="kicker">Call ended</div><h1>Evaluating your call&#8230;</h1>
    <div class="card" style="margin-top:14px;text-align:center;padding:36px">
      <div class="spin-ring" style="width:26px;height:26px;border-width:3px;margin:0 auto 14px;display:block"></div>
      <p style="color:var(--muted);font-size:14px">Scoring your performance using YCER-001&#8230; about 15 seconds.</p>
    </div>`;return;
  }

  const scores=sc.scores||{};
  const notes=sc.score_notes||{};
  const overall=sc.overall_score??0;
  const result=sc.result||"FAIL";
  const rc=result==="PASS"?"var(--good)":"var(--bad)";
  const hp=sc.hidden_profile_reveal||{};

  const rubric=[
    {key:"rapport",label:"Rapport & Conversation Control",max:5},
    {key:"discovery",label:"Discovery & Need Identification",max:10},
    {key:"recommendation",label:"Recommendation & Transition",max:10},
    {key:"pitch_quality",label:"ForeverClean Pitch Quality",max:20},
    {key:"terms_accuracy",label:"ForeverClean Terms Accuracy",max:25},
    {key:"features_benefits",label:"Customer-Specific Value / FAB",max:10},
    {key:"clarification",label:"Customer Questions & Clarification",max:5},
    {key:"closing",label:"Closing & Commitment",max:15},
  ];

  function catNotes(key){
    const n=notes[key];if(!n)return "";
    const ev=n.evidence?`<div style="font-size:11.5px;color:var(--dim);font-style:italic;margin:4px 0 6px;line-height:1.5">${esc(n.evidence)}</div>`:"";
    const s=(n.strengths||[]).map(x=>`<div class="li" style="font-size:12px">${esc(x)}</div>`).join("");
    const o=(n.opportunities||[]).map(x=>`<div class="li" style="font-size:12px">${esc(x)}</div>`).join("");
    return ev
      +(s?`<div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--good);font-weight:700;margin:6px 0 3px">Strengths</div>${s}`:"")
      +(o?`<div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--peach);font-weight:700;margin:6px 0 3px">Opportunities</div>${o}`:"");
  }

  const cteSection=sc.cte_present?`
  <div class="cte-box">
    <div class="section-title">&#9888; Critical Terms Error (CTE)</div>
    ${sc.cte_details?.incorrect_term?`<p style="font-size:13px;margin-bottom:6px"><b>Incorrect term:</b> ${esc(sc.cte_details.incorrect_term)}</p>`:""}
    ${sc.cte_details?.agent_statement?`<p style="font-size:13px;margin-bottom:6px"><b>Agent said:</b> "${esc(sc.cte_details.agent_statement)}"</p>`:""}
    ${sc.cte_details?.correct_standard?`<p style="font-size:13px;margin-bottom:6px"><b>Correct standard:</b> ${esc(sc.cte_details.correct_standard)}</p>`:""}
    <p style="font-size:13px;color:${sc.cte_details?.self_corrected?"var(--good)":"var(--bad)"}"><b>${sc.cte_details?.self_corrected?"&#10003; Self-corrected during call":"&#10007; NOT corrected — score capped at 79 (FAIL)"}</b></p>
  </div>`:""

  app.innerHTML=`
  <div class="topbar"><img src="${LOGO_DATA_URI}" class="brandlogo" alt="PA"/><span class="pill">YES Customer Simulator</span><span class="grow"></span></div>
  <div class="kicker">Readiness Debrief &#8226; YCER-001</div>
  <h1>${esc(ST.agent)}</h1>

  <div class="card" style="margin-top:16px;text-align:center;padding:30px">
    <div class="score-big">${overall}/100</div>
    <div style="margin-top:12px"><span class="pass-badge ${result==="PASS"?"pass":"fail"}">${esc(result)}</span></div>
    <div style="margin-top:10px;font-size:12px;color:var(--muted)">90&#8211;100 Strong &#183; 80&#8211;89 Meets Standard &#183; 70&#8211;79 Development Required &#183; Below 70 Significant Development</div>
  </div>

  ${cteSection}

  <div class="card">
    <div class="section-title" style="margin-top:0">Hidden Customer Profile &#128065;</div>
    <div class="profile-grid">
      <div class="profile-item"><b>Name</b><br>${esc(p.name)}</div>
      <div class="profile-item"><b>Age</b><br>${esc(p.age)}</div>
      <div class="profile-item"><b>Lifestyle</b><br>${esc(hp.lifestyle||p.lifestyle)}</div>
      <div class="profile-item"><b>Priority</b><br>${esc(hp.primary_priority||p.priority)}</div>
      <div class="profile-item"><b>Decision Style</b><br>${esc(hp.decision_style||p.decision)}</div>
      <div class="profile-item"><b>Service Exp.</b><br>${esc(hp.service_experience||p.serviceExp)}</div>
      <div class="profile-item" style="grid-column:1/-1"><b>Home</b><br>${esc(p.homeType)}, ${p.beds}bd/${p.baths}ba${p.hasPets?", pets":""} &#8212; Correct hours: <b>${p.recHours}h</b>${p.upcharge>0?` (+$${p.upcharge} upcharge)`:""}</div>
      <div class="profile-item" style="grid-column:1/-1"><b>Cleaning Habits</b><br>${esc(hp.cleaning_habit||p.cleaningHabit)}</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" style="margin-top:0">Scoring Breakdown &#8212; YCER-001</div>
    ${rubric.map(r=>`
    <div class="rubric-row">
      <div style="flex:1">
        <div class="rubric-label">${r.label}</div>
        <div class="rubric-notes">${catNotes(r.key)}</div>
      </div>
      <div class="rubric-score">${scores[r.key]??0}/${r.max}</div>
    </div>`).join("")}
  </div>

  ${(sc.strengths||[]).length?`<div class="card"><div class="section-title" style="margin-top:0">&#10024; Strengths Observed</div>${(sc.strengths||[]).map((s,i)=>`<div class="li"><b>${i+1}.</b> ${esc(s)}</div>`).join("")}</div>`:""}
  ${(sc.areas_for_improvement||[]).length?`<div class="card"><div class="section-title" style="margin-top:0">&#128161; Areas for Improvement</div>${(sc.areas_for_improvement||[]).map((s,i)=>`<div class="li"><b>${i+1}.</b> ${esc(s)}</div>`).join("")}</div>`:""}

  ${sc.pitch_feedback?`<div class="card"><div class="section-title" style="margin-top:0">ForeverClean Pitch Feedback</div><p style="font-size:13.5px;line-height:1.6;color:var(--ink)">${esc(sc.pitch_feedback)}</p></div>`:""}
  ${sc.terms_feedback?`<div class="card"><div class="section-title" style="margin-top:0">Terms Accuracy Feedback</div><p style="font-size:13.5px;line-height:1.6;color:var(--ink)">${esc(sc.terms_feedback)}</p></div>`:""}
  ${sc.transcript_summary?`<div class="card"><div class="section-title" style="margin-top:0">Call Summary</div><p style="font-size:13.5px;line-height:1.7;color:var(--muted)">${esc(sc.transcript_summary)}</p></div>`:""}

  <div class="card" style="border-color:${rc};border-width:2px">
    <div class="section-title" style="margin-top:0;color:${rc}">&#127919; Final Assessment</div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
      <span class="pass-badge ${result==="PASS"?"pass":"fail"}" style="font-size:14px;padding:6px 18px">${esc(result)}</span>
      <span style="font-family:var(--display);font-size:24px;font-weight:800;color:${rc}">${overall}/100</span>
    </div>
    ${sc.primary_gap?`<div class="section-title">Primary Gap</div><p style="font-size:13.5px;margin-bottom:10px">${esc(sc.primary_gap)}</p>`:""}
    ${sc.recommended_practice?`<div class="section-title">Recommended Practice</div><p style="font-size:13.5px">${esc(sc.recommended_practice)}</p>`:""}
  </div>

  <div class="row" style="margin-top:20px;gap:10px">
    <button class="btn ghost" id="backHome">&#8592; Change details</button>
    <button class="btn mint" id="again" style="flex:1">&#128222; Practice again</button>
  </div>`;

  document.getElementById("again").onclick=startCall;
  document.getElementById("backHome").onclick=()=>{ST.view="welcome";render();};

  if(sc&&!ST._dashSaved){
    ST._dashSaved=true;const sc2=sc.scores||{};
    dashAdd({
      timestamp:new Date().toLocaleString(),
      agent_name:ST.agent,agent_email:ST.email,team:ST.team,date_hired:ST.dateHired,
      scenario:p.lifestyle+" &#8212; "+p.household,call_entry:p.entry.type,
      overall_score:sc.overall_score,result:sc.result,
      cte:sc.cte_present?"YES":"NO",
      rapport:sc2.rapport||0,discovery:sc2.discovery||0,recommendation:sc2.recommendation||0,
      pitch_quality:sc2.pitch_quality||0,terms_accuracy:sc2.terms_accuracy||0,
      features_benefits:sc2.features_benefits||0,clarification:sc2.clarification||0,closing:sc2.closing||0,
      primary_gap:sc.primary_gap||"",transcript_summary:sc.transcript_summary||"",
    });
  }
}

/* DASHBOARD */
function renderDashboard(app){
  const rows=dashLoad();
  const fA=ST._dashFilter||"",fR=ST._dashFilterResult||"";
  let filtered=rows;
  if(fA.trim())filtered=filtered.filter(r=>(r.agent_name||"").toLowerCase().includes(fA.toLowerCase()));
  if(fR)filtered=filtered.filter(r=>(r.result||"")===fR);
  const total=filtered.length,passed=filtered.filter(r=>r.result==="PASS").length,failed=filtered.filter(r=>r.result==="FAIL").length;
  const sc2=filtered.map(r=>Number(r.overall_score)).filter(n=>!isNaN(n));
  const avg=sc2.length?Math.round(sc2.reduce((a,b)=>a+b,0)/sc2.length):null;

  app.innerHTML=`
  <div class="topbar"><img src="${LOGO_DATA_URI}" class="brandlogo" alt="PA"/><span class="pill">Dashboard</span><span class="grow"></span>
    <button class="btn ghost" id="dlCsv" style="padding:6px 12px;font-size:12px">&#11015; CSV</button>
    <button class="btn ghost" id="backDash" style="padding:6px 12px;font-size:12px">&#8592; Back</button>
  </div>
  <div class="kicker">Results &#8226; YES Customer Simulator</div><h1>All Calls</h1>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0">
    <div class="card dash-stat" style="padding:14px"><div class="val">${total}</div><div class="lbl">Total</div></div>
    <div class="card dash-stat" style="padding:14px"><div class="val" style="color:var(--good)">${passed}</div><div class="lbl">Passed</div></div>
    <div class="card dash-stat" style="padding:14px"><div class="val" style="color:var(--bad)">${failed}</div><div class="lbl">Failed</div></div>
    <div class="card dash-stat" style="padding:14px"><div class="val" style="color:var(--purple)">${avg??"-"}</div><div class="lbl">Avg Score</div></div>
  </div>

  <div class="card" style="display:flex;gap:10px;padding:14px;flex-wrap:wrap">
    <input id="fAgent" placeholder="Filter by agent&#8230;" style="flex:1;min-width:140px" value="${esc(fA)}"/>
    <select id="fResult" style="flex:0 0 140px">
      <option value="">All results</option>
      <option value="PASS" ${fR==="PASS"?"selected":""}>PASS</option>
      <option value="FAIL" ${fR==="FAIL"?"selected":""}>FAIL</option>
    </select>
  </div>

  ${filtered.length===0?`<div class="card" style="text-align:center;padding:36px;color:var(--muted)">No results yet. Complete a call to see data here.</div>`:
  filtered.map((r,i)=>`
  <div class="card" id="drow-${i}" style="cursor:pointer;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><span style="font-weight:800;font-size:14px;color:var(--ink)">${esc(r.agent_name)}</span><span style="color:var(--muted);font-size:12px;margin-left:8px">${esc(r.team)}</span>${r.cte==="YES"?`<span style="margin-left:8px;font-size:10px;background:rgba(232,150,160,.2);color:var(--bad);padding:2px 7px;border-radius:99px;font-weight:700">CTE</span>`:""}</div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:var(--display);font-size:22px;font-weight:800;color:var(--purple)">${r.overall_score}</span>
        <span class="pass-badge ${r.result==="PASS"?"pass":"fail"}">${esc(r.result)}</span>
        <span id="chev-${i}" style="color:var(--muted)">&#9658;</span>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(r.timestamp)} &#183; Hired: ${esc(r.date_hired||"—")} &#183; ${esc(r.scenario)}</div>
    <div id="ddetail-${i}" style="display:none;margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12.5px;margin-bottom:10px">
        <span>Rapport: <b>${r.rapport}/5</b></span><span>Discovery: <b>${r.discovery}/10</b></span>
        <span>Recommendation: <b>${r.recommendation}/10</b></span><span>Pitch Quality: <b>${r.pitch_quality}/20</b></span>
        <span>Terms Accuracy: <b>${r.terms_accuracy}/25</b></span><span>FAB: <b>${r.features_benefits}/10</b></span>
        <span>Clarification: <b>${r.clarification}/5</b></span><span>Closing: <b>${r.closing}/15</b></span>
      </div>
      ${r.primary_gap?`<div class="section-title" style="margin-top:8px">Primary Gap</div><p style="font-size:13px">${esc(r.primary_gap)}</p>`:""}
      ${r.transcript_summary?`<div class="section-title">Summary</div><p style="font-size:13px;color:var(--muted);line-height:1.6">${esc(r.transcript_summary)}</p>`:""}
    </div>
  </div>`).join("")}`;

  document.getElementById("backDash").onclick=()=>{ST.view="welcome";render();};
  document.getElementById("fAgent").oninput=e=>{ST._dashFilter=e.target.value;render();};
  document.getElementById("fResult").onchange=e=>{ST._dashFilterResult=e.target.value;render();};
  filtered.forEach((_,i)=>{
    const row=document.getElementById(`drow-${i}`);
    if(row)row.onclick=()=>{const d=document.getElementById(`ddetail-${i}`);const c=document.getElementById(`chev-${i}`);if(d){d.style.display=d.style.display==="none"?"block":"none";if(c)c.innerHTML=d.style.display==="none"?"&#9658;":"&#9660;";}};
  });
  document.getElementById("dlCsv").onclick=()=>{
    const cols=["Timestamp","Agent Name","Email","Team","Date Hired","Scenario","Call Entry","Overall Score","Result","CTE","Rapport","Discovery","Recommendation","Pitch Quality","Terms Accuracy","FAB","Clarification","Closing","Primary Gap","Summary"];
    const csvRows=[cols.join(","),...filtered.map(r=>[r.timestamp,r.agent_name,r.agent_email,r.team,r.date_hired,r.scenario,r.call_entry,r.overall_score,r.result,r.cte,r.rapport,r.discovery,r.recommendation,r.pitch_quality,r.terms_accuracy,r.features_benefits,r.clarification,r.closing,r.primary_gap,r.transcript_summary].map(v=>'"'+String(v==null?"":v).replace(/"/g,'\"\"')+ '"').join(","))];
    const blob=new Blob([csvRows.join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`ycsim-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);
  };
}

document.addEventListener("DOMContentLoaded",()=>render());
</script>
</body>
</html>
